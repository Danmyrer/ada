[project]
name = "audio-delay-assistant"
version = "0.1.0"
description = "Measure rough Bluetooth speaker audio delay using a microphone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sounddevice",
    "matplotlib",
]

[project.scripts]
ada = "audio_delay_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"